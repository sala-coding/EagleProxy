name: CI

# The project's own gate: what a change has to pass before it is worth looking
# at. Three things, in the order they can catch things:
#
#   go       — the backend compiles, vet has nothing to say, and the tests pass
#   frontend — the types are right and the bundle is built (vue-tsc + vite)
#   package  — the whole thing still comes out as one executable
#
# Windows, not Linux: this is a Windows program (the TUN adapter, the system
# proxy, wintun and the tray are all Windows), and the systray fork the tray
# comes from builds for Windows only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per branch: a newer push makes the older one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check and build
        working-directory: frontend
        run: npm run build

  package:
    name: Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Build the executable
        run: wails build -ldflags "-X main.appVersion=0.0.0-ci+$($env:GITHUB_SHA.Substring(0,7))"

      - name: The executable is there
        run: |
          if (-not (Test-Path build/bin/Eagle.exe)) { throw "build/bin/Eagle.exe was not built" }
          Get-Item build/bin/Eagle.exe | Select-Object Name, Length
