name: CI

# The project's own gate: what a change has to pass before it is worth looking
# at. One thing:
#
#   frontend — the types are right and the bundle is built (vue-tsc + vite)
#
# Windows, not Linux: this is a Windows program (the TUN adapter, the system
# proxy, wintun and the tray are all Windows).
#
# The backend jobs the file used to carry are gone on purpose: internal/ is
# deliberately untracked (the packages stay local, the published repo carries
# everything else), so a cloud-side `go build ./...` or `wails build` has
# nothing to compile — both jobs failed on every push since the untracking.
# The backend still builds and tests locally before every release, and the
# release artefacts come from that local build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per branch: a newer push makes the older one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check and build
        working-directory: frontend
        run: npm run build
