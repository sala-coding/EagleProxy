<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="EagleProxy">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12171e"/>
      <stop offset="1" stop-color="#1a212a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#9fa76e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9fa76e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b949e" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#ground)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="136" font-size="74" font-weight="600" fill="#e6edf3" letter-spacing="1">EagleProxy</text>
    <text x="600" y="180" font-size="19" fill="#8b949e" letter-spacing="7">WINDOWS PROXY CLIENT</text>
  </g>

  <rect x="552" y="214" width="96" height="4" rx="2" fill="#9fa76e"/>
</svg>
