<!DOCTYPE html>
<html lang="en" style="background:#000000;color:#d7dee8;color-scheme:dark">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <!-- The app's own mark, the same artwork the exe and the tray wear, read from the
         icon directory rather than inlined so the tree holds one copy of it. The 32px
         file is the size a tab actually draws it at. -->
    <link rel="icon" type="image/png" href="/fa/icon/eagle_32.png"/>
    <!-- The type is the system's own (see body in style.css): there is no face to
         preload, so the window paints in the reader's UI font from the first frame. -->
    <title>Eagle</title>
</head>
<body style="width:100%;height:100%;margin:0">
<div id="app" style="width:100%;height:100%"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
